version: '3.8'  # declara a versão do Compose

services:
  db:
    image: postgres:15
    container_name: modulo1_db
    environment:
      POSTGRES_DB: modulo1db
      POSTGRES_USER: modulo1
      POSTGRES_PASSWORD: modulo1
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  mongo:
    image: mongo:6.0
    container_name: modulo1_mongo
    restart: always
    ports:
      - "27017:27017"

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: modulo1_opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"

  graylog:
    image: graylog/graylog:5.1
    container_name: modulo1_graylog
    depends_on:
      - mongo
      - opensearch
    environment:
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_ROOT_USERNAME: admin
      # hash SHA‑256 de 'admin':
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
      # segredo aleatório para gerar tokens de sessão (≥16 caracteres):
      GRAYLOG_PASSWORD_SECRET: "ThisIsAVerySecretPasswordSecretChangeMe"
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://mongo:27017/graylog
    ports:
      - "9000:9000"
      - "12201:12201/udp"

  app:
    build: .
    container_name: modulo1_app
    depends_on:
      - db
      - graylog
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/modulo1db
      SPRING_DATASOURCE_USERNAME: modulo1
      SPRING_DATASOURCE_PASSWORD: modulo1
    ports:
      - "8080:8080"
    restart: always

volumes:
  db-data: