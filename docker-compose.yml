version: '3.8'

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22

    container_name: kafka_zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka1:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka1
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"

  kafka2:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka2
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9093:9092"

  kafka3:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka3
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9092"

  producer:
    build: ./producer
    container_name: modulo4_producer
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"

  consumer1:
    build: ./consumer1
    container_name: modulo4_consumer1
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8081:8081"

  consumer2:
    build: ./consumer2
    container_name: modulo4_consumer2
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8082:8082"

networks:
  default:
    name: modulo4_network